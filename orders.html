<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Orders Tracking | BuildX</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    .orders-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 40px;
    }

    .orders-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .orders-header h1 {
      font-size: 32px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border-radius: var(--radius-pill);
      padding: 5px 20px;
      box-shadow: var(--shadow-sm);
    }

    .search-box input {
      border: none;
      outline: none;
      padding: 10px;
      font-size: 14px;
      font-family: 'Outfit';
    }

    .tabs {
      display: flex;
      gap: 30px;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 30px;
    }

    .tab {
      padding: 10px 0;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab:hover {
      color: var(--primary);
    }

    .tab.active {
      color: var(--primary);
      border-color: var(--primary);
    }

    .order-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      margin-bottom: 30px;
      overflow: hidden;
      transition: transform 0.3s;
    }

    .order-card:hover {
      box-shadow: var(--shadow-md);
    }

    .order-summary-bar {
      background: #f9fafb;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .order-stat {
      display: flex;
      flex-direction: column;
    }

    .order-stat label {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .order-stat strong {
      color: var(--text-dark);
    }

    .order-body {
      padding: 30px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 15px;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .status-pending {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-shipped {
      background: #fef08a;
      color: #854d0e;
    }

    .status-delivered {
      background: #d1fae5;
      color: #065f46;
    }

    /* ---- TRACKING TIMELINE CSS ---- */
    .tracking-timeline {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 30px 20px 40px;
      padding-top: 20px;
    }

    .tracking-timeline::before {
      content: '';
      position: absolute;
      top: 30px;
      left: 10%;
      right: 10%;
      height: 4px;
      background: #e5e7eb;
      z-index: 1;
      border-radius: 2px;
    }

    .tracking-step {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      text-align: center;
    }

    .tracking-icon {
      width: 45px;
      height: 45px;
      background: #fff;
      border: 3px solid #e5e7eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #9ca3af;
      margin-bottom: 10px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tracking-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tracking-date {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }

    /* Active Step Styling */
    .tracking-step.active .tracking-icon {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      box-shadow: 0 0 0 5px var(--primary-glow);
      transform: scale(1.1);
    }

    .tracking-step.active .tracking-label {
      color: var(--text-dark);
    }

    .tracking-step.completed .tracking-icon {
      border-color: #10b981;
      background: #10b981;
      color: #fff;
    }

    .tracking-progress-bar {
      position: absolute;
      top: 30px;
      left: 10%;
      height: 4px;
      background: var(--gradient);
      z-index: 1;
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .item-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      background: #f9fafb;
      padding: 15px;
      border-radius: var(--radius-sm);
    }

    .item-row img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      background: #f3f4f6;
      border-radius: var(--radius-sm);
      padding: 10px;
    }

    .item-details h4 {
      font-size: 18px;
      color: var(--text-dark);
      margin-bottom: 5px;
    }

    .item-actions {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }

    .seller-toolbar {
      background: #fff4ed;
      padding: 15px 30px;
      display: flex;
      gap: 15px;
      align-items: center;
      border-top: 1px solid #fed7aa;
    }

    @media (max-width: 768px) {
      .orders-container {
        padding: 0 20px;
      }

      .orders-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .order-summary-bar {
        flex-wrap: wrap;
        gap: 15px;
      }

      .item-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header class="main-header glass">
    <div class="logo-container" onclick="window.location.href='index.html'">
      Build<span>X</span>
    </div>

    <div class="nav-actions">
      <a href="customer.html" class="nav-btn" id="accountNav">
        <i class='bx bx-user'></i>
        <span id="navGreeting">Account</span>
      </a>
      <a href="orders.html" class="nav-btn">
        <i class='bx bxs-package' style="color:var(--primary);"></i>
        <span style="color:var(--primary);">Orders</span>
      </a>
      <a href="cart.html" class="nav-btn">
        <i class='bx bx-cart-alt'></i>
        <span>Cart</span>
        <div class="cart-badge" id="cartCountBadge">0</div>
      </a>
    </div>
  </header>

  <div class="orders-container">
    <div class="orders-header">
      <h1>Your Orders</h1>
      <div class="search-box">
        <i class='bx bx-search' style="color:var(--text-muted);"></i>
        <input type="text" placeholder="Search orders...">
      </div>
    </div>

    <div class="tabs">
      <div class="tab active">All Orders</div>
      <div class="tab">Not Shipped</div>
      <div class="tab">Cancelled</div>
    </div>

    <div id="ordersList">
      <div style="text-align:center; padding: 50px;">
        <i class='bx bx-loader-alt bx-spin' style="font-size:40px; color:var(--primary);"></i>
      </div>
    </div>
  </div>

  <script src="orders.js"></script>
</body>

</html>
